services:
  mongo:
    image: mongo
    container-name: mongo_container
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
  
  server: 
    build: ./backend
    container-name: backend_container
    ports:
      - "5000:5000"
    depends_on:
      - mongo 
    volumes:
      - ./backend:/app
      - /backend/node_modules
    environment:
      - MONGO_DB_URL=mongodb://mongo:20017/userDB

  client: 
    build: ./admin
    container-name: admin_container
    ports:
      - "5173:5173"
    depends_on:
      - server 
    stdin_open: true
    tty: true
    volumes:
      - ./admin:/app
      - /admin/node_modules
    environment:
      - MONGO_DB_URL=mongodb://mongo:20017/userDB

volumes:
  mongo_data: